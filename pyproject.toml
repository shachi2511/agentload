[project]
name = "agentload"
version = "0.1.0"
description = "Replay realistic AI-agent workloads against OpenAI-compatible APIs and measure cost, cache health and latency."
requires-python = ">=3.11"
dependencies = ["openai>=3.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
