name: sequential
mode: sequential
description: >
  Coding-agent loop. Each turn appends 1-4K tokens of synthetic tool output and the model
  replies with one sentence. Compares default cache retention (3 billing blocks) with a
  10-minute TTL (1 block). Tests H1 (flat cost per turn), H2 (cache reuse) and the TTL price lever.
model: glm-5.3-flash-fast
turns: 50
tool_tokens: [1000, 4000]
max_tokens: 1000
budget_usd: 1.0
variants:
  - name: default
    extra_body: {}
  - name: ttl10m
    extra_body:
      prompt_cache_options:
        ttl: "10m"
